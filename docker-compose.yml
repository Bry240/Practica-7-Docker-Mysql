services:

  app:
    build: ./src
    container_name: hola-mundo-app
    ports:
      - "8081:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: hola_mundo
      DB_USER: appuser
      DB_PASSWORD: apppass123
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: hola-mundo-mysql
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: hola_mundo
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data: